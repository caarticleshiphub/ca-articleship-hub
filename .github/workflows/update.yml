
name: Update CA Articleship Jobs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect articleship opportunities
        run: python scripts/collect_jobs.py

      - name: Save updated job database
        run: |
          git config user.name "CA Articleship Hub Bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Update articleship opportunities"
          git push
          
